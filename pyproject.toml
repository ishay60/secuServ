[project]
name = "secuserv"
version = "0.1.0"
description = "Conformance self-test for the safety guardrails of your own, locally-run MCP server"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "langgraph",
    "mcp",
    "pydantic>=2",
]

[project.scripts]
secuserv = "secuserv.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secuserv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
