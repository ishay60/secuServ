[project]
name = "secuserv"
version = "0.1.0"
description = "Conformance self-test for the safety guardrails of your own, locally-run MCP server"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ishay Rosengarten" }]
keywords = ["mcp", "model-context-protocol", "security", "conformance", "langgraph"]
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "langgraph",
    "mcp",
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/ishay60/secuServ"
Issues = "https://github.com/ishay60/secuServ/issues"

[project.scripts]
secuserv = "secuserv.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secuserv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
